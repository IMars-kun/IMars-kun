<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>mars@titanialab ~ interactive mode</title>
<style>
  :root{
    --bg:#05010c; --panel:#0d0620; --cyan:#00e0ff; --pink:#ff4ecb; --purple:#a06bff; --text:#c9d1d9; --dim:#5a6270;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:
      radial-gradient(circle at 20% 20%, #150826 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, #100a2b 0%, transparent 45%),
      var(--bg);
    font-family:'Fira Code', Consolas, monospace; color:var(--text);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .crt{
    width:100%; max-width:820px; background:var(--panel); border-radius:12px;
    border:1px solid #251a3d; box-shadow:0 0 60px rgba(160,107,255,0.15), inset 0 0 40px rgba(0,224,255,0.03);
    overflow:hidden;
  }
  .titlebar{
    display:flex; align-items:center; gap:8px; padding:10px 14px; background:#0a0416; border-bottom:1px solid #251a3d;
  }
  .dot{width:11px;height:11px;border-radius:50%;}
  .dot.r{background:#ff5f56;} .dot.y{background:#ffbd2e;} .dot.g{background:#27c93f;}
  .titlebar span{margin-left:10px; color:var(--dim); font-size:12px;}
  #screen{
    height:460px; overflow-y:auto; padding:18px 20px; font-size:14px; line-height:1.6;
  }
  #screen::-webkit-scrollbar{width:8px;}
  #screen::-webkit-scrollbar-thumb{background:#251a3d; border-radius:4px;}
  .line{white-space:pre-wrap; word-break:break-word;}
  .prompt{color:var(--cyan);}
  .cmd{color:#fff;}
  .out{color:var(--text);}
  .accent{color:var(--pink);}
  .purple{color:var(--purple);}
  .dim{color:var(--dim);}
  #inputRow{display:flex; align-items:center; padding:0 20px 18px;}
  #inputRow .prompt{margin-right:8px;}
  #cmdInput{
    flex:1; background:transparent; border:none; outline:none; color:#fff;
    font-family:inherit; font-size:14px; caret-color:var(--cyan);
  }
  .badge-row{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}
  .badge{
    padding:3px 10px; border-radius:999px; font-size:11px; border:1px solid #3a2d5c; color:var(--purple);
  }
  a{color:var(--cyan);}
</style>
</head>
<body>

<div class="crt">
  <div class="titlebar">
    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
    <span>mars@titanialab: ~/interactive-mode</span>
  </div>
  <div id="screen"></div>
  <div id="inputRow">
    <span class="prompt">mars@titanialab:~$</span>
    <input id="cmdInput" type="text" autofocus autocomplete="off" spellcheck="false" />
  </div>
</div>

<script>
const screen = document.getElementById('screen');
const input = document.getElementById('cmdInput');
let unlocked = new Set();

function print(html){
  const div = document.createElement('div');
  div.className = 'line out';
  div.innerHTML = html;
  screen.appendChild(div);
  screen.scrollTop = screen.scrollHeight;
}
function printCmd(text){
  const div = document.createElement('div');
  div.className = 'line';
  div.innerHTML = `<span class="prompt">mars@titanialab:~$</span> <span class="cmd">${text}</span>`;
  screen.appendChild(div);
  screen.scrollTop = screen.scrollHeight;
}

const commands = {
  help: () => `
Available commands:
  <span class="accent">about</span>       — who is Mars
  <span class="accent">skills</span>      — tech stack
  <span class="accent">projects</span>    — mission log of shipped work
  <span class="accent">achievements</span>— unlockable badges (try exploring!)
  <span class="accent">contact</span>     — how to reach me
  <span class="accent">sudo</span>        — try it ;)
  <span class="accent">clear</span>       — clear the screen`,

  about: () => {
    unlocked.add('curious');
    return `Informatics / CS student who treats side projects like a personal
space program — every idea gets a launch attempt.
Building <span class="purple">TitaniaLab</span>, a small universe of self-shipped digital products.
Currently deep in Theory of Computation, Networking, Software Engineering & Databases.`;
  },

  skills: () => {
    unlocked.add('curious');
    return `
<span class="purple">Frontend</span>  Next.js · React · Tailwind CSS · Framer Motion · Three.js
<span class="purple">Backend</span>   PHP (Native & OOP) · Node.js · PostgreSQL · MySQL
<span class="purple">Tools</span>     Docker · WebSocket · Git`;
  },

  projects: () => {
    unlocked.add('curious');
    return `
<span class="accent">💍 NiatKawin</span>   — digital wedding invitation platform (flagship)
                  Next.js · Tailwind v4 · Framer Motion · Three.js
<span class="accent">📸 SnapFrame</span>   — real-time photobooth, 16 templates
<span class="accent">🤖 TG AI Bot</span>   — production Telegram bot, Dockerized
<span class="accent">📚 BiblioNova/BookVault</span> — PHP library & book CRUD systems
<span class="accent">🎟️ Ticketing</span>   — real-time QR check-in system (in progress)

🔗 <a href="https://niatkawin.titanialab.com" target="_blank">niatkawin.titanialab.com</a>`;
  },

  contact: () => `
📧 youremail@example.com
🔗 <a href="https://niatkawin.titanialab.com" target="_blank">niatkawin.titanialab.com</a>
💬 LinkedIn / Instagram — add your links here`,

  sudo: () => {
    unlocked.add('rebel');
    return `<span class="accent">Permission denied.</span> Nice try though — that's achievement-worthy. 🏆`;
  },

  achievements: () => {
    const list = [
      ['curious', '🔍 Curious Mind', 'ran about / skills / projects'],
      ['rebel', '🕹️ Rule Breaker', 'tried sudo'],
      ['explorer', '🗺️ Explorer', 'typed an unknown command'],
    ];
    const rows = list.map(([key,name,desc]) =>
      unlocked.has(key)
        ? `  ✅ ${name} — <span class="dim">${desc}</span>`
        : `  🔒 ${'?'.repeat(name.replace(/[^a-zA-Z ]/g,'').length)} — locked`
    ).join('\n');
    return `Achievements unlocked (${unlocked.size}/3):\n${rows}`;
  },

  clear: () => { screen.innerHTML=''; return null; },
};

function boot(){
  print(`<span class="purple">Connecting to mars@titanialab...</span>`);
  print(`Signal locked. Welcome to interactive mode 🪐`);
  print(`Type <span class="accent">help</span> to see available commands.\n`);
}
boot();

input.addEventListener('keydown', (e) => {
  if(e.key !== 'Enter') return;
  const raw = input.value.trim();
  if(!raw) return;
  printCmd(raw);
  input.value = '';

  const key = raw.toLowerCase();
  if(commands[key]){
    const result = commands[key]();
    if(result) print(result);
  } else {
    unlocked.add('explorer');
    print(`<span class="dim">command not found:</span> ${raw} — type <span class="accent">help</span>`);
  }
});

input.addEventListener('blur', () => setTimeout(()=>input.focus(), 10));
</script>
</body>
</html>
